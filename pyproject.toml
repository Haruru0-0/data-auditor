[project]
name = "dataauditor"
version = "0.1.0"
description = "Scan CSV and Parquet files and report data-quality problems"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
web = ["fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.33"]
dev = ["pytest==8.4.2", "httpx==0.28.1", "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.33"]

[project.scripts]
dataauditor = "dataauditor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: takes several seconds (large generated file)"]
