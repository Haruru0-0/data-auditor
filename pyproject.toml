[project]
name = "dataauditor"
version = "0.1.0"
description = "Scan CSV and Parquet files and report data-quality problems"
requires-python = ">=3.12"
dependencies = ["duckdb==1.5.6"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
dataauditor = "dataauditor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataauditor = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
