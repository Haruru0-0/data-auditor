[project]
name = "dataauditor"
version = "0.1.0"
description = "Scan CSV and Parquet files and report data-quality problems"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
dataauditor = "dataauditor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
