name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build the report page
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      # The build is byte-identical across two local runs. Line endings are ignored
      # so a checkout with different newline settings cannot cause a false failure.
      - name: Committed report page matches a fresh build
        run: git diff --exit-code --ignore-cr-at-eol src/dataauditor/static/report.html
